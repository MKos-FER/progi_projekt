spring.application.name=LetsDoSports

# Persistent directory outside the build tree; mount persistent storage here in containers.
app.profile-photos.directory=${PROFILE_PHOTO_DIRECTORY:${user.home}/.lets-do-sports/profile-photos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Google OAuth - vrijednosti dolaze iz .env (pokretati iz backend/LetsDoSports)
spring.config.import=optional:file:.env[.properties]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL}/oauth2/login/code/{registrationId}
app.frontend-url=${FRONTEND_URL}
