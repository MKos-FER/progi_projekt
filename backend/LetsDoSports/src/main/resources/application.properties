spring.application.name=LetsDoSports
# Local launches from the repository root or backend/LetsDoSports.
spring.config.import=optional:file:./db/.env[.properties],optional:file:../../db/.env[.properties]
spring.datasource.url=${LDS_DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:lets_do_sports}}
spring.datasource.username=${LDS_DB_USER:${APP_DB_USER:lds_app}}
spring.datasource.password=${LDS_DB_PASSWORD:${APP_DB_PASSWORD}}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
lds.cors.allowed-origins=${LDS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=${LDS_PHOTO_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${LDS_PHOTO_MAX_REQUEST_SIZE:6MB}
